<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunjungan Lapangan</title>
<meta name="theme-color" content="#1D3F8F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

:root{
  --bg:#EAEEF5; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#14232D; --ink-2:#4B5C66; --line:#CDD5E3;
  --brand:#1D3F8F; --brand-2:#142E6B; --on-brand:#FFFFFF; --mop:#F59E0B; --on-mop:#2A1700;
  --ok:#22704A; --ok-bg:#D9EFE1; --wait:#7E5B00; --wait-bg:#FAEDBF; --bad:#A93623; --bad-bg:#F7DCD5; --idle:#56656E; --idle-bg:#E1E8E7;
  --shadow:0 1px 0 rgba(20,35,45,.06), 0 8px 24px -14px rgba(20,35,45,.35);
  --paper:#FFFFFF; --paper-ink:#1A1A1A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#161F2E; --surface-2:#1C2738; --ink:#E6EEEE; --ink-2:#9DB0B4; --line:#2B3850;
    --brand:#4A6FD1; --brand-2:#3557B5; --on-brand:#FFFFFF; --mop:#F59E0B; --on-mop:#2A1700;
    --ok:#7FD3A2; --ok-bg:#173A29; --wait:#F2D06B; --wait-bg:#3A3014; --bad:#F29A86; --bad-bg:#43211A; --idle:#A9B7BC; --idle-bg:#22343A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161F2E; --surface-2:#1C2738; --ink:#E6EEEE; --ink-2:#9DB0B4; --line:#2B3850;
  --brand:#4A6FD1; --brand-2:#3557B5; --on-brand:#FFFFFF; --mop:#F59E0B; --on-mop:#2A1700;
  --ok:#7FD3A2; --ok-bg:#173A29; --wait:#F2D06B; --wait-bg:#3A3014; --bad:#F29A86; --bad-bg:#43211A; --idle:#A9B7BC; --idle-bg:#22343A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Manrope,system-ui,sans-serif;line-height:1.15;margin:0}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mop);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.mop{background:var(--mop);border-color:var(--mop);color:var(--on-mop)}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

/* fields */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-weight:600;font-size:13.5px}
.field small{color:var(--ink-2);font-size:12.5px}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}

/* auth screens */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.auth-top{background:var(--brand);color:var(--on-brand);padding:26px 26px 22px;position:relative}
.auth-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--mop) 0 14px,var(--brand-2) 14px 28px)}
.auth-top h1{font-size:28px;font-weight:800}
.auth-top p{margin:6px 0 0;opacity:.85}
.auth-body{padding:24px 26px 26px}
.auth-body .btn{width:100%;padding:12px}
.hint{color:var(--ink-2);font-size:13px;margin:14px 0 0;text-align:center}

/* header */
.top{background:var(--brand);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--brand)}
.top-in{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:40px;height:40px;border-radius:12px;background:var(--mop);color:var(--on-mop);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.b-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;line-height:1.1}
.b-sub{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{text-align:right;line-height:1.2}
.who-name{font-weight:700;font-size:14px}
.who-role{font-size:12px;opacity:.8}
.top .btn.ghost{color:var(--on-brand)}
.top .btn.ghost:hover{background:rgba(255,255,255,.12)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--on-brand);opacity:.75;padding:10px 14px 12px;font-weight:600;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap}
.tab:hover{opacity:1}
.tab.on{opacity:1;border-bottom-color:var(--mop)}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--mop) 0 14px,var(--brand-2) 14px 28px)}

main{padding:22px 0 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}
.toolbar .field{margin:0;min-width:160px}
.toolbar .grow{flex:1}
.banner{background:var(--wait-bg);color:var(--wait);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:500}

/* hero progress */
.hero{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center}
.hero-num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.02em}
.hero-num span{color:var(--ink-2);font-size:32px;font-weight:600}
.hero-txt h2{font-size:20px}
.hero-txt p{margin:4px 0 0;color:var(--ink-2)}
.bucket{grid-column:1/-1;height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.bucket i{display:block;height:100%;background:var(--mop);border-radius:99px;transition:width .5s ease}

/* list cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:17px}
.card .loc{color:var(--ink-2);font-size:13px;margin:0}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:6px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.wait{background:var(--wait-bg);color:var(--wait)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.idle{background:var(--idle-bg);color:var(--idle)}
.note{background:var(--surface-2);border-left:4px solid var(--line);padding:8px 10px;border-radius:6px;font-size:13.5px;margin:0}
.note.bad{border-left-color:var(--bad)}
.muted{color:var(--ink-2)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:32px;line-height:1}
.stat span{color:var(--ink-2);font-size:13px}
.stat.wait b{color:var(--wait)} .stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.sec-title{font-size:18px;margin:26px 0 12px}

/* report cards */
.reps{display:grid;gap:14px}
.rep{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(220px,300px) 1fr;overflow:hidden}
.rep-photos{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.ph{position:relative;border:0;padding:0;margin:0;background:var(--surface-2);cursor:zoom-in;aspect-ratio:3/4;overflow:hidden;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:600}
.ph.none{cursor:default;display:grid;place-items:center;color:var(--ink-2);font-size:12.5px;text-align:center;padding:8px}
.ph.none span{position:static;background:none;color:var(--ink-2)}
.rep-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rep-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.rep-head h3{font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:13px;margin:0}
details{font-size:13.5px}
summary{cursor:pointer;font-weight:600}
.checks{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:3px}
.checks li{display:flex;gap:8px;align-items:start}
.checks li::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;border-radius:4px;border:2px solid var(--line)}
.checks li.y::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--surface)}
.checks li.n{color:var(--ink-2);text-decoration:line-through}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
@media (max-width:640px){
  .rep{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero-num{font-size:52px}
  .who{display:none}
}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:12.5px;color:var(--ink-2);font-weight:700;background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{color:var(--ink-2);margin:0 0 16px}
.missing{display:flex;flex-wrap:wrap;gap:8px}
.missing span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,16,20,.55)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet.wide{width:min(900px,calc(100vw - 24px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 10px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-h h2{font-size:21px}
.sheet-b{padding:4px 20px 20px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.checkrow{display:flex;gap:10px;align-items:start;padding:9px 10px;border-radius:10px;cursor:pointer}
.checkrow:hover{background:var(--surface-2)}
.checkrow input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:block;border:2px dashed var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--surface-2);text-align:center}
.pick:hover{border-color:var(--brand)}
.pick .pv{aspect-ratio:3/4;display:grid;place-items:center;color:var(--ink-2);font-size:13px;padding:8px}
.pick .pv img{width:100%;height:100%;object-fit:cover}
.pick .pv svg{width:34px;height:34px;opacity:.6}
.pick b{display:block;padding:8px;font-size:13.5px;border-top:1px solid var(--line);background:var(--surface)}
.pick.has .pv{padding:0}
.zoom img{width:100%;border-radius:10px;display:block}
.ro-check{display:grid;gap:4px}
.toolbar:empty{display:none}
.toolbar input,.toolbar select{height:44px}
.rep-photos{background:var(--surface-2);gap:0}
.ph + .ph{border-left:2px solid var(--surface)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.cam,.gal,.shot-acts .btn{position:relative}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(420px,calc(100vw - 24px))}
.tst{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;font-size:14px}
.tst.bad{background:var(--bad);color:#fff}

/* print preview */
#printRoot{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
#printRoot[hidden]{display:none}
.pr-bar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr-bar h2{font-size:18px;flex:1;min-width:180px}
.pr-page{max-width:860px;margin:22px auto 60px;background:var(--paper);color:var(--paper-ink);padding:36px 40px;box-shadow:var(--shadow);border-radius:4px}
@media (max-width:640px){.pr-page{padding:20px 16px;margin:12px}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-2)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.bucket i{transition:none}}

/* ===== Desktop: admin / manager ===== */
.desk{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--brand);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:22px 14px 18px;gap:22px;z-index:20}
.side .brand{flex:none;padding:0 6px}
.side .mob-acts{display:none;gap:4px}
.snav{display:grid;gap:4px}
.snav .tab{display:flex;align-items:center;gap:12px;border:0;border-radius:10px;padding:11px 12px;text-align:left;width:100%;font-size:15px}
.snav .tab svg{width:20px;height:20px;flex:none}
.snav .tab:hover{background:rgba(255,255,255,.08)}
.snav .tab.on{background:rgba(255,255,255,.15);box-shadow:inset 4px 0 0 var(--mop)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.2);padding:14px 6px 0;display:grid;gap:10px}
.side-foot .who{text-align:left;display:block}
.side-foot .row{display:flex;gap:6px}
.side .btn.ghost{color:var(--on-brand)}
.side .btn.ghost:hover{background:rgba(255,255,255,.12)}
.desk-main{min-width:0}
.desk-main main{padding:30px 34px 60px}
.desk-main .wrap{max-width:1320px;padding:0}
.page-title{font-size:30px;font-weight:800;margin:0 0 4px}
.page-date{color:var(--ink-2);margin:0 0 18px}
@media (min-width:1300px){.desk .reps{grid-template-columns:1fr 1fr}}
@media (max-width:899px){
  .desk{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side{height:auto;padding:12px 12px 0;gap:8px}
  .side .brand{padding:0}
  .side .mob-acts{display:flex}
  .snav{display:flex;overflow-x:auto;scrollbar-width:none}
  .snav::-webkit-scrollbar{display:none}
  .snav .tab{width:auto;white-space:nowrap;border-radius:8px 8px 0 0;padding:9px 12px 11px}
  .snav .tab.on{box-shadow:inset 0 -4px 0 var(--mop);background:transparent}
  .side-foot{display:none}
  .desk-main main{padding:18px 14px 60px}
  .page-title{font-size:24px}
}

/* ===== Mobile app: staff ===== */
.mob{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.mob-top{background:var(--brand);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 16px 14px;display:flex;align-items:center;gap:12px}
.mob-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-45deg,var(--mop) 0 12px,var(--brand-2) 12px 24px)}
.mob-top .who{display:block}
.mob main{padding:18px 14px 24px}
.mob .wrap{padding:0}
.mob .grid{grid-template-columns:1fr;gap:12px}
.mob .hero{grid-template-columns:auto 1fr;padding:18px}
.mob .hero-num{font-size:54px}
.mob .toolbar .field{flex:1 1 140px}
.mob .toolbar .grow{display:none}
.mob .toolbar .btn{flex:1 1 100%;padding:13px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px -14px rgba(0,0,0,.4)}
.bnav-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.bnav .tab{color:var(--ink-2);opacity:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:12.5px;border:0;border-top:3px solid transparent;background:none;cursor:pointer;font-weight:600}
.bnav .tab svg{width:26px;height:26px}
.bnav .tab.on{color:var(--brand);border-top-color:var(--mop)}
.task{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.task-h{display:flex;justify-content:space-between;align-items:start;gap:10px}
.task h3{font-size:18px}
.task .btn{width:100%;padding:14px;font-size:16px;border-radius:12px}
.task .btn svg{width:22px;height:22px}
.prof{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--mop);color:var(--on-mop);display:grid;place-items:center;font:800 22px "Bricolage Grotesque",sans-serif;flex:none}
.stack{display:grid;gap:10px;margin-top:14px}
.stack .btn{justify-content:flex-start;padding:15px 16px;font-size:16px;border-radius:12px}

/* ===== Work form: steps + camera ===== */
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:22px}

}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body::before{display:none}
  body > :not(#printRoot){display:none!important}
  #printRoot{position:static;overflow:visible;background:#fff}
  .pr-bar{display:none}
  .pr-page{box-shadow:none;margin:0;padding:0;max-width:none}

}
function subVisits() {

function subActive() {

}
function setDate(d) { if (d && d !== S.date) { S.date = d; mapFit = true; subVisits(); } }
function refresh() { if (S.screen && S.screen.startsWith('app')) { renderContent(); if (S.tab === 'pantau') updateMap(); } }

function route() {

const TITLES = { pantau:['Pemantauan kunjungan','Posisi check-in dan check-out petugas, foto bukti, dan waktu server.'], customer:['Customer','Daftar customer beserta titik lokasi dan radius absen.'], pengguna:['Pengguna','Akun manager dan petugas lapangan.'], pengaturan:['Pengaturan','Identitas perusahaan dan radius default.'] };

/* ---------- visit rendering ---------- */
const loadingBlock = () => `<div class="loading" style="min-height:30vh"><div><div class="spin"></div>Memuat kunjungan…</div></div>`;
function flagsOf(v) {
  const f = [];
  if (v.in?.inside === false) f.push(`Check-in berjarak ${fmtDist(v.in.dist)} dari titik customer (radius ${v.in.radius} m)`);
  if (v.out?.inside === false) f.push(`Check-out berjarak ${fmtDist(v.out.dist)} dari titik customer`);
  for (const [k, l] of [['in', 'check-in'], ['out', 'check-out']]) {
    const p = v[k]; if (!p) continue;
    if (p.acc > 100) f.push(`Akurasi GPS ${l} rendah (±${p.acc} m)`);
    const sv = tsDate(p.server);
    if (sv) { const diff = Math.abs(sv - new Date(p.device)) / 60000; if (diff > 5) f.push(`Waktu ${l} di HP selisih ${Math.round(diff)} menit dari waktu server (dikirim tanpa sinyal, atau jam HP tidak sesuai)`); }
  }
  return f;
}
function locChip(p) { return p.inside === true ? chip('Di lokasi', 'ok') : p.inside === false ? chip('Di luar radius', 'bad') : chip('Titik customer belum ada', 'idle'); }
function ptLine(p) {
  return `${fmtTimeS(ptTime(p))} <span class="muted">±${p.acc} m${p.dist != null ? `, ${fmtDist(p.dist)} dari customer` : ''}</span> <a href="${gmaps(p.lat, p.lng)}" target="_blank" rel="noopener">Lihat peta</a>`;
}
function photoBtn(v, k) {
  const p = v[k]; const label = k === 'in' ? 'Check-in' : 'Check-out';
  return p?.photo ? `<button class="ph" data-act="zoom" data-id="${esc(v.id)}" data-k="${k}" aria-label="Perbesar foto ${label}"><img src="${esc(p.photo)}" alt="Foto ${label} ${esc(v.customerName)}" loading="lazy"><span>${label}</span></button>`

}
function visitCard(v, mgr) {
  const tin = ptTime(v.in), tout = v.out ? ptTime(v.out) : null;
  const dur = tout ? tout - tin : Date.now() - tin;
  const fl = flagsOf(v), cust = custOf(v);
  const canSetLoc = mgr && v.in && (!cust || !hasLoc(cust));
  return `<article class="rep" id="v-${esc(v.id)}">
    <div class="rep-photos">${photoBtn(v, 'in')}${photoBtn(v, 'out')}</div>
    <div class="rep-body">
      <div class="rep-head"><div><h3>${esc(v.customerName)}</h3>${v.customerAddress ? `<p class="meta">${esc(v.customerAddress)}</p>` : ''}</div>
        <div style="display:grid;gap:4px;justify-items:end">${v.status === 'selesai' ? chip('Selesai', 'ok') : chip('Sedang berkunjung', 'go')}${locChip(v.in)}</div></div>
      <dl class="kv">
        ${mgr ? `<dt>Petugas</dt><dd><b>${esc(v.staffName)}</b></dd>` : ''}
        <dt>Check-in</dt><dd>${ptLine(v.in)}</dd>
        <dt>Check-out</dt><dd>${v.out ? ptLine(v.out) : '<span class="muted">Belum check-out</span>'}</dd>
        <dt>Durasi</dt><dd>${fmtDur(dur)}${tout ? '' : ' <span class="muted">(berjalan)</span>'}</dd>
        <dt>Keperluan</dt><dd>${esc(v.purpose || '–')}</dd>
        ${v.note ? `<dt>Catatan</dt><dd>${esc(v.note)}</dd>` : ''}

      ${mgr ? `<div class="acts">
        ${canSetLoc ? `<button class="btn sm" data-act="setCustLoc" data-id="${esc(v.id)}">${ICON.pin}${cust ? 'Jadikan titik lokasi customer' : 'Simpan sebagai customer baru'}</button>` : ''}

/* ---------- monitoring map ---------- */
let MAP = null, MAPL = null, mapFit = true;
const tiles = () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });

function updateMap() {

/* ---------- GPS ---------- */
function acquireGPS(onUpdate) {
  if (!navigator.geolocation) { onUpdate({ error: 'Perangkat atau browser ini tidak mendukung GPS.' }); return () => {}; }
  let best = null, done = false; const t0 = Date.now();
  const finish = () => { if (done) return; done = true; navigator.geolocation.clearWatch(id); clearTimeout(tm); if (best) onUpdate({ fix: best, done: true }); };
  const id = navigator.geolocation.watchPosition(p => {
    const c = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.max(1, Math.round(p.coords.accuracy)), at: new Date(p.timestamp).toISOString() };
    if (!best || c.acc <= best.acc) best = c;
    if (best.acc <= 20 || Date.now() - t0 > 20000) finish(); else onUpdate({ fix: best, done: false });
  }, e => {
    if (best) return finish();
    done = true; navigator.geolocation.clearWatch(id); clearTimeout(tm);
    onUpdate({ error: e.code === 1 ? 'Izin lokasi ditolak. Buka pengaturan Chrome atau aplikasi, izinkan Lokasi, lalu tekan Coba lagi.' : e.code === 3 ? 'Sinyal GPS belum didapat. Pindah ke area lebih terbuka atau dekat jendela, lalu tekan Coba lagi.' : 'Lokasi tidak dapat dibaca. Pastikan GPS (Lokasi) di HP aktif.' });
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
  const tm = setTimeout(finish, 22000);
  return () => { done = true; navigator.geolocation.clearWatch(id); clearTimeout(tm); };
}

/* ---------- photos ---------- */
async function toCanvas(file, max, lines) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Foto tidak bisa dibaca. Coba ambil ulang.')); i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
    if (lines && lines.length) {
      const fs = Math.max(11, Math.round(c.width / 38)), lh = fs * 1.45, h = lh * lines.length + fs * .9;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - h, c.width, h);
      g.fillStyle = '#fff'; g.textBaseline = 'top';
      lines.forEach((t, i) => { g.font = `${i ? 600 : 800} ${fs}px Manrope, Arial, sans-serif`; g.fillText(t, fs * .6, c.height - h + fs * .45 + i * lh, c.width - fs * 1.2); });
    }
    return c;
  } finally { URL.revokeObjectURL(url); }
}
async function storePhoto(file, lines) {
  let max = 1100, q = 0.68, d = '';
  for (let i = 0; i < 6; i++) { const c = await toCanvas(file, max, lines); d = c.toDataURL('image/jpeg', q); if (d.length < 180000) return d; max = Math.round(max * 0.82); q = Math.max(0.4, q - 0.05); }
  return d;
}
function slotHTML(src) {
  if (!src) return `<label class="cam"><input type="file" accept="image/*" capture="environment" data-ph="1" class="sr">${ICON.cam}<span>Ambil foto di lokasi</span><small>Foto tampak depan lokasi, papan nama, atau pekerjaan</small></label>
    <label class="gal"><input type="file" accept="image/*" data-ph="1" class="sr">atau pilih dari galeri</label>`;

    <div class="shot-acts"><label class="btn"><input type="file" accept="image/*" capture="environment" data-ph="1" class="sr">${ICON.cam}Foto ulang</label><label class="btn"><input type="file" accept="image/*" data-ph="1" class="sr">Dari galeri</label></div>`;
}

    if (!(r >= 10 && r <= 5000)) return toast('Radius harus antara 10 dan 5000 meter.', 'bad');
    busy(f, true);
    try { await S.db.doc(C.set).set({ ...S.settings, officeName: v.office.trim(), address: v.address.trim(), radius: r }); toast('Pengaturan disimpan.'); }
    catch (e) { toast(errMsg(e), 'bad'); }
    busy(f, false);
  },
  async delUser(f) {
    const u = f.dataset.user, a = S.accounts[u]; if (!a) return closeModal();
    if (u === S.me) return toast('Tidak bisa menghapus akun sendiri.', 'bad');
    if (a.role === 'manager' && a.active !== false && activeManagers().length <= 1) return toast('Harus ada minimal satu manager aktif.', 'bad');
    busy(f, true);
    try { await S.db.doc(C.acc + '/' + u).delete(); closeModal(); toast(`Akun ${a.name} dihapus.`); }
    catch (e) { toast(errMsg(e), 'bad'); busy(f, false); }
  },
  async delVisit(f) {
    busy(f, true);
    try { await S.db.doc(C.vis + '/' + f.dataset.id).delete(); closeModal(); toast('Kunjungan dihapus.'); }
    catch (e) { toast(errMsg(e), 'bad'); busy(f, false); }
  }
};
document.addEventListener('submit', e => { const f = e.target; if (!f.dataset.form) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });

/* ---------- actions ---------- */
const ACT = {
  tab: d => setTab(d.tab),
  close: () => closeModal(),
  logout: () => { if (S.unsubAct) { S.unsubAct(); S.unsubAct = null; } S.active = []; S.me = null; ss('fv-user', null); S.tab = null; route(); },
  checkin: () => openCheck('in'),
  checkout: d => openCheck('out', d.id),
  regps: () => startGPS(),
  async install() { if (!installEvt) return toast('Buka menu ⋮ di Chrome, lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".'); installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; },
  goto: d => { MAP && MAP.closePopup(); const el = document.getElementById('v-' + d.id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.animate([{ outline: '3px solid var(--mop)' }, { outline: '3px solid transparent' }], { duration: 1600 }); } },
  zoom: d => {
    const v = S.visits.find(x => x.id === d.id) || S.active.find(x => x.id === d.id); if (!v) return; const p = v[d.k];
    openModal(`${sheetHead(`${v.customerName}, foto ${d.k === 'in' ? 'check-in' : 'check-out'}`)}<div class="sheet-b"><img src="${esc(p.photo)}" alt="Foto ${esc(v.customerName)}" style="width:100%;border-radius:10px;display:block"><p class="muted">${esc(v.staffName)}, ${fmtTimeS(ptTime(p))}, ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} (±${p.acc} m) <a href="${gmaps(p.lat, p.lng)}" target="_blank" rel="noopener">Buka di Google Maps</a></p></div>`, true);
  },
  pw: () => openModal(`${sheetHead('Ganti password')}<form data-form="pw"><div class="sheet-b">
      <div class="field"><label for="p-old">Password lama</label><input id="p-old" type="password" name="old" required></div>
      <div class="field"><label for="p-new">Password baru</label><input id="p-new" type="password" name="pw" minlength="6" required></div>
      <div class="field"><label for="p-new2">Ulangi password baru</label><input id="p-new2" type="password" name="pw2" minlength="6" required></div>
    </div><div class="sheet-f"><button class="btn" type="button" data-act="close">Batal</button><button class="btn primary" type="submit">Ganti password</button></div></form>`),
  custForm: d => {
    const c = d.id ? S.customers.find(x => x.id === d.id) : null;
    openModal(`${sheetHead(c ? 'Ubah customer' : 'Tambah customer')}<form data-form="cust" ${c ? `data-id="${esc(c.id)}"` : ''}><div class="sheet-b">
      <div class="field"><label for="c-name">Nama customer</label><input id="c-name" type="text" name="name" value="${esc(c?.name || '')}" required></div>
      <div class="field"><label for="c-addr">Alamat</label><input id="c-addr" type="text" name="address" value="${esc(c?.address || '')}"></div>
      <div class="field"><label for="c-ct">Kontak (PIC dan nomor telepon)</label><input id="c-ct" type="text" name="contact" value="${esc(c?.contact || '')}"></div>
      <div class="field"><label for="c-coord">Titik lokasi (latitude, longitude)</label><input id="c-coord" type="text" name="coord" value="${hasLoc(c) ? `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}` : ''}" placeholder="-6.200000, 106.816666">
        <span class="coord-help">Klik titik di peta, tekan "Pakai lokasi saya" saat berada di lokasi, atau tempel koordinat dari Google Maps (klik kanan titik di Google Maps, lalu klik angka koordinatnya untuk menyalin).</span>
        <div id="custMap" class="minimap" style="height:260px"></div>
        <span><button type="button" class="btn sm" data-act="custHere">${ICON.pin}Pakai lokasi saya</button></span></div>
      <div class="field"><label for="c-rad">Radius absen (meter)</label><input id="c-rad" type="text" inputmode="numeric" name="radius" value="${c?.radius || ''}" placeholder="Default ${defRadius()}"><small>Gedung besar atau kawasan pabrik sebaiknya diberi radius lebih besar.</small></div>
      <div class="field"><label for="c-act">Status</label><select id="c-act" name="active"><option value="on">Aktif</option><option value="off" ${c?.active === false ? 'selected' : ''}>Nonaktif</option></select></div>
    </div><div class="sheet-f"><button class="btn" type="button" data-act="close">Batal</button><button class="btn primary" type="submit">${c ? 'Simpan perubahan' : 'Tambah customer'}</button></div></form>`);
    setTimeout(() => {
      const el = $('#custMap'); if (!el || !window.L) { if (el) el.hidden = true; return; }
      MODALMAP = L.map(el).setView([-6.2, 106.82], 11); tiles().addTo(MODALMAP); CM = {};
      MODALMAP.on('click', e => setCustPin({ lat: e.latlng.lat, lng: e.latlng.lng }, true));
      if (hasLoc(c)) setCustPin(c, false);
    }, 60);
  },
  custHere: (d, b) => {
    if (!navigator.geolocation) return toast('GPS tidak didukung di perangkat ini.', 'bad');
    b.disabled = true; b.textContent = 'Mencari lokasi…';
    navigator.geolocation.getCurrentPosition(p => { b.disabled = false; b.innerHTML = `${ICON.pin}Pakai lokasi saya`; setCustPin({ lat: p.coords.latitude, lng: p.coords.longitude }, true); toast(`Lokasi didapat (akurasi ±${Math.round(p.coords.accuracy)} m).`); },
      () => { b.disabled = false; b.innerHTML = `${ICON.pin}Pakai lokasi saya`; toast('Lokasi tidak didapat. Izinkan akses lokasi lalu coba lagi.', 'bad'); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  },
  async setCustLoc(d, b) {
    const v = S.visits.find(x => x.id === d.id); if (!v) return; const p = v.in, cust = custOf(v);
    b.disabled = true;
    try {
      if (cust) await S.db.doc(C.cust + '/' + cust.id).update({ lat: p.lat, lng: p.lng });
      else { const ref = S.db.collection(C.cust).doc(); await ref.set({ name: v.customerName, address: v.customerAddress || '', contact: '', lat: p.lat, lng: p.lng, radius: null, active: true, createdAt: new Date().toISOString() }); await S.db.doc(C.vis + '/' + v.id).update({ customerId: ref.id }); }
      toast(`Titik lokasi ${v.customerName} disimpan. Check-in berikutnya akan diperiksa radiusnya.`);
    } catch (e) { toast(errMsg(e), 'bad'); b.disabled = false; }
  },
  delVisit: d => {
    const v = S.visits.find(x => x.id === d.id); if (!v) return;
    openModal(`${sheetHead('Hapus kunjungan?')}<form data-form="delVisit" data-id="${esc(v.id)}"><div class="sheet-b"><p style="margin-top:0">Kunjungan <b>${esc(v.staffName)}</b> ke <b>${esc(v.customerName)}</b> pada ${fmtTime(ptTime(v.in))} akan dihapus permanen beserta fotonya.</p></div>
      <div class="sheet-f"><button class="btn" type="button" data-act="close">Batal</button><button class="btn bad" type="submit">Hapus</button></div></form>`);
  },
  userForm: d => {
    const u = d.user, a = u ? S.accounts[u] : null;
    openModal(`${sheetHead(a ? 'Ubah pengguna' : 'Tambah pengguna')}<form data-form="user" ${u ? `data-user="${esc(u)}"` : ''} autocomplete="off"><div class="sheet-b">
      <div class="field"><label for="u-name">Nama lengkap</label><input id="u-name" type="text" name="name" value="${esc(a?.name || '')}" required></div>
      <div class="field"><label for="u-user">Username</label><input id="u-user" type="text" name="username" value="${esc(u || '')}" autocapitalize="none" ${u ? 'disabled' : 'required'}></div>
      <div class="field"><label for="u-role">Peran</label><select id="u-role" name="role"><option value="staff">Petugas lapangan</option><option value="manager" ${a?.role === 'manager' ? 'selected' : ''}>Manager</option></select></div>
      <div class="field"><label for="u-pw">${a ? 'Password baru (kosongkan jika tidak diganti)' : 'Password'}</label><input id="u-pw" type="password" name="pw" autocomplete="new-password" ${a ? '' : 'required minlength="6"'}></div>
    </div><div class="sheet-f"><button class="btn" type="button" data-act="close">Batal</button><button class="btn primary" type="submit">${a ? 'Simpan perubahan' : 'Buat akun'}</button></div></form>`);
  },
  async userToggle(d) {
    const a = S.accounts[d.user]; if (!a) return;
    if (a.active !== false && a.role === 'manager' && activeManagers().length <= 1) return toast('Harus ada minimal satu manager aktif.', 'bad');
    try { await S.db.doc(C.acc + '/' + d.user).update({ active: a.active === false }); } catch (e) { toast(errMsg(e), 'bad'); }
  },
  userDel: d => {
    const a = S.accounts[d.user]; if (!a) return;
    openModal(`${sheetHead('Hapus pengguna?')}<form data-form="delUser" data-user="${esc(d.user)}"><div class="sheet-b"><p style="margin-top:0">Akun <b>${esc(a.name)}</b> (${esc(d.user)}) akan dihapus permanen dan tidak bisa login lagi.</p><p class="muted" style="font-size:13.5px">Riwayat kunjungan yang sudah tercatat tetap tersimpan dengan nama petugas ini. Jika hanya ingin menghentikan sementara, gunakan <b>Nonaktifkan</b>.</p></div>
      <div class="sheet-f"><button class="btn" type="button" data-act="close">Batal</button><button class="btn bad" type="submit">Hapus permanen</button></div></form>`);
  },
  csv: () => exportCSV(),
  print: () => openPrint(),
  closePrint: () => closePrint(),
  doPrint: () => { try { window.print(); } catch (e) { toast('Gunakan tombol Unduh lalu cetak dari browser.', 'bad'); } },
  dlReport: () => { download(`laporan-kunjungan-${S.date}.html`, `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Laporan kunjungan ${S.date}</title><style>body{margin:0;background:#fff}.page{max-width:900px;margin:24px auto;padding:0 20px}@media print{@page{size:A4;margin:12mm}.page{margin:0;padding:0;max-width:none}}${RPT_CSS}</style></head><body><div class="page">${reportHTML()}</div></body></html>`, 'text/html'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.tagName === 'LABEL') return;
  if (b.tagName === 'A') e.preventDefault();
  ACT[b.dataset.act]?.(b.dataset, b);
});

/* ---------- report & export ---------- */
function reportVisits() { return (isMgr() ? filteredVisits() : S.visits.filter(v => v.username === S.me)).slice().sort((a, b) => (ptTime(a.in) || 0) - (ptTime(b.in) || 0)); }
function reportHTML() {
  const vs = reportVisits(), staff = isMgr() ? S.staffFilter : S.me;
  const done = vs.filter(v => v.status === 'selesai'), out = vs.filter(v => v.in?.inside === false);
  const ptCell = p => p ? `${fmtTimeS(ptTime(p))}<br><a href="${gmaps(p.lat, p.lng)}">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</a><br>±${p.acc} m${p.dist != null ? `, ${fmtDist(p.dist)}` : ''}` : '–';
  return `<div class="rpt">
    <div class="rpt-h"><div><h1>Laporan Kunjungan Lapangan</h1><p>${esc(S.settings.officeName || '')}${S.settings.address ? '<br>' + esc(S.settings.address) : ''}</p></div>
      <div class="rpt-meta"><b>Tanggal</b><span>${esc(fmtDate(S.date))}</span><b>Petugas</b><span>${staff ? esc(nameOf(staff)) : 'Semua petugas'}</span><b>Dicetak</b><span>${esc(fmtStamp(new Date()))}</span></div></div>
    <div class="rpt-sum"><div><b>${vs.length}</b><span>Total kunjungan</span></div><div><b>${done.length}</b><span>Selesai (check-out)</span></div><div><b>${vs.length - done.length}</b><span>Belum check-out</span></div><div><b>${out.length}</b><span>Check-in di luar radius</span></div></div>
    <h2>Rincian kunjungan</h2>
    ${vs.length ? `<table><thead><tr><th>No</th><th>Customer</th>${staff ? '' : '<th>Petugas</th>'}<th>Check-in</th><th>Check-out</th><th>Durasi</th><th>Status lokasi</th><th>Keperluan / hasil</th></tr></thead><tbody>
      ${vs.map((v, i) => { const ti = ptTime(v.in), to = v.out ? ptTime(v.out) : null; return `<tr><td>${i + 1}</td><td><b>${esc(v.customerName)}</b>${v.customerAddress ? '<br>' + esc(v.customerAddress) : ''}</td>${staff ? '' : `<td>${esc(v.staffName)}</td>`}
        <td>${ptCell(v.in)}</td><td>${ptCell(v.out)}</td><td>${to ? fmtDur(to - ti) : '–'}</td>
        <td class="${v.in.inside === false ? 'bad' : v.in.inside ? 'ok' : ''}">${v.in.inside === false ? 'Di luar radius' : v.in.inside ? 'Di lokasi' : 'Titik customer belum ada'}</td>
        <td>${esc(v.purpose || '')}${v.note ? '<br>Catatan: ' + esc(v.note) : ''}${v.out?.result ? '<br>Hasil: ' + esc(v.out.result) : ''}</td></tr>`; }).join('')}</tbody></table>` : '<p>Tidak ada kunjungan pada tanggal ini.</p>'}
    ${vs.length ? `<h2>Foto bukti</h2><div class="rpt-photos">${vs.map(v => `<figure><div class="pair">
        <div>${v.in?.photo ? `<img src="${esc(v.in.photo)}" alt="Check-in">` : 'Tanpa foto'}</div>
        <div>${v.out?.photo ? `<img src="${esc(v.out.photo)}" alt="Check-out">` : (v.out ? 'Tanpa foto check-out' : 'Belum check-out')}</div></div>
        <figcaption><b>${esc(v.customerName)}</b>${esc(v.staffName)}. Kiri: check-in ${fmtTime(ptTime(v.in))}, kanan: check-out ${v.out ? fmtTime(ptTime(v.out)) : '–'}</figcaption></figure>`).join('')}</div>` : ''}
    <div class="rpt-sign"><div>Petugas lapangan<div class="ln">${staff ? esc(nameOf(staff)) : '(..............................)'}</div></div><div>Diperiksa oleh<div class="ln">${isMgr() ? esc(me().name) : '(..............................)'}</div></div></div>
    <p class="rpt-foot">Waktu berdasarkan server. Koordinat dari GPS perangkat petugas saat check-in dan check-out.</p></div>`;
}
function openPrint() {
  if (!S.visLoaded) return toast('Data masih dimuat, coba sebentar lagi.');
  const pr = $('#printRoot');
  pr.innerHTML = `<div class="pr-bar"><button class="btn sm" data-act="closePrint">✕ Tutup</button><h2>Pratinjau laporan, ${esc(fmtDate(S.date))}</h2>
    <button class="btn sm" data-act="dlReport">${ICON.dl}Unduh (HTML)</button><button class="btn primary sm" data-act="doPrint">${ICON.print}Cetak</button></div><div class="pr-page">${reportHTML()}</div>`;
  pr.hidden = false; pr.scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closePrint() { const pr = $('#printRoot'); pr.hidden = true; pr.innerHTML = ''; document.body.style.overflow = ''; }
function exportCSV() {
  const vs = reportVisits(); if (!vs.length) return toast('Tidak ada data untuk diunduh.', 'bad');
  const q = x => `"${String(x ?? '').replace(/"/g, '""')}"`;
  const num = x => x == null ? '' : String(x).replace('.', ',');
  const head = ['Tanggal','Petugas','Customer','Alamat','Keperluan','Catatan','Jam check-in','Lat check-in','Lng check-in','Akurasi check-in (m)','Jarak check-in (m)','Status lokasi','Jam check-out','Lat check-out','Lng check-out','Akurasi check-out (m)','Jarak check-out (m)','Durasi (menit)','Hasil kunjungan','Peta check-in'];
  const rows = vs.map(v => { const ti = ptTime(v.in), to = v.out ? ptTime(v.out) : null, o = v.out || {};
    return [v.date, v.staffName, v.customerName, v.customerAddress, v.purpose, v.note, fmtTimeS(ti), num(v.in.lat), num(v.in.lng), v.in.acc, v.in.dist ?? '', v.in.inside === false ? 'Di luar radius' : v.in.inside ? 'Di lokasi' : 'Titik customer belum ada',
      to ? fmtTimeS(to) : '', num(o.lat), num(o.lng), o.acc ?? '', o.dist ?? '', to ? Math.round((to - ti) / 60000) : '', o.result || '', gmaps(v.in.lat, v.in.lng)].map(q).join(';'); });
  download(`kunjungan-${S.date}${S.staffFilter ? '-' + S.staffFilter : ''}.csv`, '\ufeff' + [head.map(q).join(';'), ...rows].join('\r\n'), 'text/csv;charset=utf-8');
  toast('File CSV diunduh. Buka dengan Excel.');
}

init();
</script>
</body>
</html>
